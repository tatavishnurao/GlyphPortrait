<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>GlyphPortrait critical path</title><desc>Portrait likeness, meaningful text, and coherent text-flow geometry intersect. Image-derived regions guide lanes before words are placed on text paths.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">THE CONSTRAINT / THREE THINGS MUST HOLD</text><g transform="translate(45 70)"><rect class="b" width="190" height="72" rx="4"/><text class="m" x="12" y="20">SIGNAL</text><text class="t" x="12" y="46">portrait likeness</text><text class="s" x="12" y="63">regions + contours</text></g><g transform="translate(305 70)"><rect class="b" width="190" height="72" rx="4"/><text class="m" x="12" y="20">SIGNAL</text><text class="t" x="12" y="46">meaningful text</text><text class="s" x="12" y="63">user-provided words</text></g><g transform="translate(565 70)"><rect class="b" width="190" height="72" rx="4"/><text class="m" x="12" y="20">SIGNAL</text><text class="t" x="12" y="46">coherent geometry</text><text class="s" x="12" y="63">streamline lanes</text></g><path class="a" d="M235 106h70M495 106h70"/><path d="M45 175h710" stroke="#666861"/><g transform="translate(45 220)"><rect class="b" width="190" height="62" rx="4"/><text class="m" x="12" y="20">GUIDE</text><text class="t" x="12" y="44">masks / regions</text></g><g transform="translate(305 220)"><rect class="b" width="190" height="62" rx="4"/><text class="m" x="12" y="20">SHAPE</text><text class="t" x="12" y="44">vectorized lanes</text></g><g transform="translate(565 220)"><rect class="b" width="190" height="62" rx="4"/><text class="m" x="12" y="20">PLACE</text><text class="t" x="12" y="44">readable text paths</text></g><path class="a" d="M400 142v50M400 192 140 220M400 192v28M400 192 660 220"/><text class="t" x="45" y="320">The image supplies geometry; the prompt supplies words.</text><text class="s" x="45" y="342">Not a generic image-generation model.</text></svg>
