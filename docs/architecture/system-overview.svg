<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>GlyphPortrait system overview</title><desc>Semantic digital micrography: a portrait and user word list become region-aware vector geometry and readable text streamlines, then PNG or SVG composition.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">GLYPHPORTRAIT / SEMANTIC DIGITAL MICROGRAPHY</text><g transform="translate(35 65)"><rect class="b" width="155" height="62" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="44">portrait image</text></g><g transform="translate(35 160)"><rect class="b" width="155" height="62" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="44">user word list</text></g><g transform="translate(245 112)"><rect class="b" width="180" height="72" rx="4"/><text class="m" x="12" y="20">ANALYSIS</text><text class="t" x="12" y="46">preprocess + masks</text><text class="s" x="12" y="63">visual regions</text></g><path class="a" d="M190 96h55M190 191 245 160"/><g transform="translate(480 112)"><rect class="b" width="195" height="72" rx="4"/><text class="m" x="12" y="20">GEOMETRY</text><text class="t" x="12" y="46">contours + lanes</text><text class="s" x="12" y="63">vectorized placement</text></g><path class="a" d="M425 148h55"/><g transform="translate(200 255)"><rect class="b" width="190" height="62" rx="4"/><text class="m" x="12" y="20">GENERATE</text><text class="t" x="12" y="44">coherent streamlines</text></g><g transform="translate(455 255)"><rect class="b" width="200" height="62" rx="4"/><text class="m" x="12" y="20">PLACE + COMPOSE</text><text class="t" x="12" y="44">readable words → PNG/SVG</text></g><path class="a" d="M577 184 295 255M577 184 555 255M390 286h65"/><text class="s" x="35" y="350">Entry points: python app.py and python cli.py --input --words --output.</text></svg>
